name: 每日取汇率和活畜价格
on:
  schedule:
    - cron: "30 10 * * *"   # 每天 UTC 10:30 = 北京时间 18:30（中行当天牌价基本发完）
  workflow_dispatch:         # 也可以在 Actions 页面手动点 Run workflow
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 取数据
        run: python scripts/fetch_all.py
      - name: 保存
        run: |
          git config user.name "rmzd-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "每日更新 $(date -u +%F)"
          git push
