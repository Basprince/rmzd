${MQ.trim()?mapRes():grid("map",rev(S.map))}</section><section><h2>特殊对应规则</h2><p class="h">优先于上面的对应表。“包含词”：用 + 连接表示必须同时出现，用 | 分隔表示任一组满足即可（如 缺失+牛前|缺失+牛后）；“排除词”出现则不适用；命中后产品名对应到“标准名称”。填了“国家”的规则只对该国的报盘生效，并且优先于其他规则（如巴西的五切、六切、七切、八切都按件套）。</p><div class="row"><button class="g" onclick="restoreRules()">恢复默认规则（只补缺的，不改你已有的）</button></div>${grid("rules",rev(S.rules))}</section><section><h2>产品组成说明</h2><p class="h">记录件套、五切六切七切、前后龟、后四、后六这些组合产品各包含哪些部位，仅作参考，方便查阅。</p><div class="row"><button class="g" onclick="restoreCombos()">恢复默认说明（只补缺的）</button></div>${grid("combos",S.combos.map((_,i)=>i))}</section><section><h2>易混淆名称（按价格区分）</h2><p class="h">有些名称不同厂家指的不是同一个产品（如“肋条”可能是短肋条，也可能是胸部/肩部肋条）。系统会按近期同类价格自动判断（相差25%以内）；拿不准时，标准名称列会出现下拉框，由你来选实际产品，选过的价格会成为以后的参考。</p><div class="row"><button class="g" onclick="restoreAmb()">恢复默认（只补缺的）</button></div>${grid("amb",S.amb.map((_,i)=>i))}</section><section><h2>厂家特殊叫法</h2><p class="h">同一个叫法，不同工厂指的产品不一样（如 26 厂报盘里的“大条”实际是粗修大米龙）。识别时，该厂号的报盘里出现这个叫法，就自动换成“实际产品”。</p>${grid("plantAlias",S.plantAlias.map((_,i)=>i))}</section><section><h2>厂家自动前缀</h2><p class="h">这个厂的产品全是同一类（如阿根廷 1085 厂都是谷饲），识别时自动给该厂所有产品名加上前缀，已带前缀的不重复加。</p>${grid("plantPrefix",S.plantPrefix.map((_,i)=>i))}</section>`}

function ambOf(r){const base=stdName(pn(r))||String(r.product||"").trim(),m=ambMap().get(base);if(!m)return null;if(r.pick)return{kind:"ok",std:r.pick,info:m};

function parseLive(t){SKL=[];const rows=[];let c={date:today(),country:"",species:"",kind:"",cur:"",unit:""};

const B64=u8=>{let s="";for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)};
const UNB64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function aesKey(pw,salt){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}

function addM(d,n){const a=d.split("-").map(Number);return new Date(Date.UTC(a[0],a[1]-1+n,a[2])).toISOString().slice(0,10)}
function finWarn(r){if(r.fin!=="是"||r.fst==="已结清")return 0;const d=nd(r.due);if(!d)return 0;const t=today();return addM(d,5)<=t?2:addM(d,3)<=t?1:0}
function fdays(date,r){const d=nd(date);if(!d)return 0;const end=r.fst==="已结清"?nd(r.fend):today();if(!end)return 0;return Math.max(0,Math.round(dayN(end)-dayN(d)))}
function stDays(r){const d=nd(r.indate);if(!d)return 0;const end=nd(r.outdate)||today();return Math.max(0,Math.round(dayN(end)-dayN(d)))}
function stFee(r){const p=parseFloat(r.sprice),d=stDays(r),t=(parseFloat(r.weight)||0)/1000;return p>0&&d>0&&t>0?+(p*t*d).toFixed(2):0}
function totCost(r){const n=x=>parseFloat(x)||0;return +(n(r.dp)+dpInt(r)+n(r.fp)+finInt(r)+stFee(r)+n(r.afee)).toFixed(2)}
function intOf(a,r,days){a=parseFloat(a);const y=parseFloat(r.rate);return a>0&&y>0&&days>0?+(a*y/100*days/360).toFixed(2):0}
function finDays(r){return fdays(r.due,r)}
function dpDays(r){return fdays(r.dpdate,r)}
function finInt(r){return intOf(r.amt,r,finDays(r))}
function dpInt(r){return intOf(r.dpamt,r,dpDays(r))}
